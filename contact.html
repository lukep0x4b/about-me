<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Luke Page's Contact Page</title>
</head>
<body>
    <h2>Navigation</h2>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="memes.html">Memes</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
    <h2>Contact Me</h2>
    <main>
        <form action="/action_page.php">
            <!--Please don't blame me for doing line breaks, I can't do CSS yet-->
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="firstname" placeholder="Your name..">
            <br>
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lastname" placeholder="Your last name..">
            <br>
            <label for="country">Country</label>
            <select id="country" name="country">
                <option value="australia">Australia</option>
                <option value="canada">Canada</option>
                <option value="usa">USA</option>
            </select>
            <br>
            <label for="color">Favorite Color</label>
            <input type="color" id="color" name="color">
            <br>
            <label for="password">Favorite Password</label>
            <input type="password" name="password" id="password">
            <br>
            <label for="num">Favorite Number</label>
            <input type="number" name="num" id="num">
            <br>
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Enter a Subject..">
            <br>
            <label for="body">Body</label>
            <textarea id="body" name="body" placeholder="Write something.." style="height:170px"></textarea>
            <br>
            <input type="submit" value="Submit">
        </form>
    </main>
</body>
</html>
